name: PUMA stabilization checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: |
          python -m py_compile \
            PUMA_DR.py PUMA_Master.py PUMA_Master_v2.py PUMA_OKD.py \
            PUMA_PO.py PUMA_RFA.py PUMA_RFPO.py PUMA_RFPS.py PUMA_RR.py \
            cloud_entrypoint.py lease.py puma_project_resolver.py \
            puma_runtime_config.py puma_google_auth.py puma_status.py test_puma_project_resolver.py test_puma_runtime_config.py test_lease.py test_puma_status.py test_puma_google_auth.py test_cloud_entrypoint.py
      - name: Import processor modules under verified TEST env
        shell: bash
        run: |
          python - <<'PY'
          import importlib
          import os
          from pathlib import Path

          for raw in Path("PUMA_TEST_ENVIRONMENT.example").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              os.environ[key.strip()] = value.strip()

          modules = [
              "puma_runtime_config",
              "puma_google_auth",
              "puma_project_resolver",
              "puma_status",
              "lease",
              "PUMA_OKD",
              "PUMA_RFA",
              "PUMA_RFPO",
              "PUMA_PO",
              "PUMA_RR",
              "PUMA_RFPS",
              "PUMA_DR",
              "PUMA_Master_v2",
              "cloud_entrypoint",
          ]
          for name in modules:
              importlib.import_module(name)
              print("Imported", name)
          PY
      - name: Resolver and runtime unit tests
        run: python -m unittest -v test_puma_project_resolver.py test_puma_runtime_config.py test_lease.py test_puma_status.py test_puma_google_auth.py test_cloud_entrypoint.py

      - name: Validate verified TEST environment file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              "PUMA_TEST_MODE": "1",
              "PUMA_SPREADSHEET_ID": "1wjGB4dUTbBUiWVC7Kh0huVw8wM_ppmjTgktLw6ElVf4",
              "PUMA_OKD_LABEL_ID": "Label_1",
              "PUMA_RFA_LABEL_NAME": "PUMA TEST/RFA",
              "PUMA_RFA_PROCESSED_LABEL_NAME": "PUMA TEST/RFA Processed",
              "PUMA_RFPO_LABEL_ID": "Label_3",
              "PUMA_PO_LABEL_NAME": "PUMA TEST/PO",
              "PUMA_RR_LABEL_NAME": "PUMA TEST/RR",
              "PUMA_RFPS_LABEL_ID": "Label_6",
              "PUMA_DR_LABEL_NAME": "PUMA TEST/DR",
              "PUMA_PO_DRIVE_FOLDER_ID": "1EeexxItqTX896tq64lf1-8lBz2bqCBmH",
              "PUMA_RR_BASE_FOLDER_ID": "1WMpQwDwGGVq8R1AYxvJPAP8gOrgmP9Bg",
              "PUMA_DR_BASE_FOLDER_ID": "12hNy09LDDFAjyDl4q97GTTsCysyvSgJf",
              "PUMA_ALLOWED_STEPS": "OKD,RFA,RFPO,PO,RR,RFPS,DR",
              "PUMA_DISABLED_STEPS": "",
              "PUMA_ARGS": "--nodebug",
              "PUMA_EXPECTED_GMAIL_ACCOUNT": "adrian@afterimagelighting.com",
              "PUMA_LEASE_SECS": "900",
          }

          vals = {}
          for raw in Path("PUMA_TEST_ENVIRONMENT.example").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              k, v = line.split("=", 1)
              vals[k.strip()] = v.strip()

          missing = {k:v for k,v in expected.items() if vals.get(k) != v}
          if missing:
              raise SystemExit(f"TEST environment drifted from verified targets: {missing}")

          live = "1pwVlYSGVjyTCLt4GT7xU2TCnxfdJuxAbp_jU6Snisls"
          if live in Path("PUMA_TEST_ENVIRONMENT.example").read_text(encoding="utf-8"):
              raise SystemExit("Live PUMA spreadsheet ID found in TEST environment file.")

          print("Verified PUMA TEST environment targets.")
          PY
      - name: Check Cloud/Test auth is non-interactive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          operational = [
              "PUMA_OKD.py",
              "PUMA_RFA.py",
              "PUMA_RFPO.py",
              "PUMA_PO.py",
              "PUMA_RR.py",
              "PUMA_RFPS.py",
              "PUMA_DR.py",
              "PUMA_Master_v2.py",
              "cloud_entrypoint.py",
          ]

          for path in operational:
              text = Path(path).read_text(encoding="utf-8")
              if path != "PUMA_Master_v2.py" and "run_local_server(" in text:
                  raise SystemExit(f"Interactive OAuth remains in operational processor: {path}")

          helper = Path("puma_google_auth.py").read_text(encoding="utf-8")
          if "TEST_MODE or _is_cloud_runtime()" not in helper:
              raise SystemExit("Shared OAuth loader is missing its Cloud/Test fail-closed guard.")

          legacy = Path("PUMA_Master.py").read_text(encoding="utf-8")
          if "from PUMA_Master_v2 import main" not in legacy:
              raise SystemExit("Legacy master is not delegating to hardened v2.")

          entry = Path("cloud_entrypoint.py").read_text(encoding="utf-8")
          if 'master = "PUMA_Master_v2.py"' not in entry or 'else "PUMA_Master.py"' in entry:
              raise SystemExit("Cloud entrypoint can still fall back to legacy master.")

          for path in ["PUMA_PO.py", "PUMA_RR.py", "PUMA_DR.py"]:
              text = Path(path).read_text(encoding="utf-8")
              if 'permissions().create' in text or '"type":"anyone"' in text or '"type": "anyone"' in text:
                  raise SystemExit(f"Public Drive sharing capability remains in {path}")

          lease = Path("lease.py").read_text(encoding="utf-8")
          if "TEST_MODE or _is_cloud_runtime()" not in lease:
              raise SystemExit("Cloud lease logic is not fail-closed.")
          if '"lease": "error-fallback"' in lease:
              raise SystemExit("Cloud lease error fallback can still run work without Firestore.")

          print("Cloud/Test auth, Drive sharing, lease, and orchestrator invariants are consolidated.")
          PY
