name: PUMA stabilization checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: |
          python -m py_compile \
            PUMA_DR.py PUMA_Master.py PUMA_Master_v2.py PUMA_OKD.py \
            PUMA_PO.py PUMA_RFA.py PUMA_RFPO.py PUMA_RFPS.py PUMA_RR.py \
            cloud_entrypoint.py lease.py puma_project_resolver.py \
            puma_runtime_config.py test_puma_project_resolver.py
      - name: Resolver unit tests
        run: python -m unittest -v test_puma_project_resolver.py
